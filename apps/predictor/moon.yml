language: python
stack: backend

tasks:
  sync:
    command: uv sync

  dev:
    command: uv run python -m predictor.main
    options:
      cache: false
      persistent: true

  camera:
    command: uv run python -m predictor.camera.server
    options:
      cache: false
      envFile: /.env
      persistent: true

  test:
    command: uv run pytest

  lint:
    command: uv run ruff check .

  type:
    command: uv run pyright

  proto:
    command: uv run python -m grpc_tools.protoc -I ../../proto --python_out=src/predictor/generated --grpc_python_out=src/predictor/generated --pyi_out=src/predictor/generated ../../proto/prediction/v1/prediction.proto
