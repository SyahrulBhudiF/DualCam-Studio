language: typescript
stack: frontend

tasks:
  dev:
    command: bun run dev
    options:
      cache: false
      envFile: /.env
      persistent: true

  build:
    command: bun run build
    options:
      envFile: /.env

  test:
    command: bun run test
    options:
      envFile: /.env

  check:
    command: bun run check
    options:
      envFile: /.env

  lint:
    command: bun run lint

  lint-fix:
    command: bun run lint:fix

  format:
    command: bun run format

  format-fix:
    command: bun run format:fix

  db-generate:
    command: bun run db:generate
    options:
      cache: false
      envFile: /.env

  db-migrate:
    command: bun run db:migrate
    options:
      cache: false
      envFile: /.env

  db-studio:
    command: bun run db:studio
    options:
      cache: false
      envFile: /.env
      persistent: true

  db-check-destructive:
    command: rg -n "DROP|DELETE|TRUNCATE" drizzle
    options:
      cache: false
