[project]
name = "quis-predictor"
version = "0.1.0"
description = "QUIS Python gRPC predictor backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "grpcio-reflection>=1.76.0",
    "delu>=0.0.26",
    "grpcio-tools>=1.76.0",
    "pydantic>=2.12.0",
    "numpy>=2.3.0",
    "pydantic-settings>=2.12.0",
    "torch>=2.9.0",
]

[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "pyright>=1.1.407",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["src/predictor/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["src/predictor/generated"]
typeCheckingMode = "strict"
